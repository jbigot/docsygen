# docsygen is consumed as a Hugo module. Its floor is the latest Hugo release, which
# tests/matrix.sh checks; tests/all.sh builds with the native decoder of a Hugo fork.
module:
  hugoVersion:
    min: 0.169.0
  # The XML reader: the native decoder of Hugo when it has it, a template reader otherwise.
  imports:
    - path: github.com/jbigot/hugo-xml-document
# Docsy's navbar calls navbar-version-selector.html only when params.versions is set. This
# placeholder makes it call docsygen's selector on every site; the selector reads the versions
# from the adapter calls and ignores this list. A site's own params.versions replaces it.
params:
  versions: [{name: docsygen}]

# The example site in PDI's own organization: hugo --config hugo.yaml,pdi-layout.yaml. Four
# placements per version (content-pdi/): the main page at /about/<version>/, the narrative pages
# at /guide/<version>/, the C API's topics at /c-api/<version>/ and the namespaces at
# /plugin-api/<version>/. PDI's own menu lists each narrative page; here they share the Guide
# entry, and its sidebar.
contentDir: content-pdi
menu:
  main:
    - name: About
      pageRef: /about/latest/
      weight: 5
    - name: Documentation
      pageRef: /docs/
      weight: 10
    - name: Guide
      pageRef: /guide/latest/
      weight: 20
    - name: C API
      pageRef: /c-api/latest/
      weight: 30
    - name: Plugin API
      pageRef: /plugin-api/latest/
      weight: 40

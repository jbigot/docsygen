# The example site in PDI's own organization: hugo --config hugo.yaml,pdi-layout.yaml. Four
# top-menu entries, each a docs section with its own sidebar (content-pdi/): the user
# documentation at /docs/<version>/ (the guide's pages, the C API, and in the latest version a
# page that documents docsygen), the plugins at /plugins/<version>/, the plugin developer
# documentation at /plugin-dev/<version>/ (how to create a plugin, the plugin API and the
# deprecated list), and the tutorial at /tutorial/<version>/, from the latest release only. Each
# section redirects to its latest version. The home and community pages come from PDI's new-site
# (github.com/pdidev/new-site), with the community's links in params.links, which Docsy's footer
# shows too.
title: PDI
contentDir: content-pdi
# Docsy's blocks and alerts write HTML around Markdown, as in docsy-example.
markup:
  goldmark:
    renderer:
      unsafe: true
menu:
  main:
    - name: Documentation
      pageRef: /docs/latest/
      weight: 10
    - name: Plugins
      pageRef: /plugins/latest/
      weight: 20
    - name: Tutorial
      pageRef: /tutorial/latest/
      weight: 30
    - name: Plugin dev.
      pageRef: /plugin-dev/latest/
      weight: 40
    - name: Community
      pageRef: /community/
      weight: 50

params:
  links:
    user:
      - name: Slack for users
        url: https://join.slack.com/t/pdidev/shared_invite/enQtNDk5OTY2MDA0Nzg0LTlkM2U1MGQwZmM3OGM1MjA0M2VlMzUyNWNjODhkNmI4MjMwZmQxMTM1ODc2ODI4MjY4ODNmNDhmY2QzOWI4Nzk
        icon: fa-brands fa-slack
        desc: Get support on Slack!
      - name: Releases
        url: https://github.com/pdidev/pdi/releases
        icon: fa-brands fa-github
        desc: Get the code from GitHub!
    developer:
      - name: GitHub
        url: https://github.com/pdidev/pdi
        icon: fa-brands fa-github
        desc: Contribute on GitHub!
      - name: Slack
        url: https://join.slack.com/t/pdidev/shared_invite/enQtNDk5OTY2MDA0Nzg0LTlkM2U1MGQwZmM3OGM1MjA0M2VlMzUyNWNjODhkNmI4MjMwZmQxMTM1ODc2ODI4MjY4ODNmNDhmY2QzOWI4Nzk
        icon: fa-brands fa-slack
        desc: Discuss with developers on Slack!
      - name: GitHub Actions
        url: https://github.com/pdidev/pdi/actions
        icon: fa-solid fa-gears
        desc: Check test results on GitHub Actions!
      - name: Container images
        url: https://github.com/orgs/pdidev/packages
        icon: fa-brands fa-docker
        desc: Try our container images from ghcr.io!

# PDI's logo, as the navbar logo (an SVG, from new-site) and as the favicon (PDI's
# docs/_template/logo.png, which Doxygen's PROJECT_ICON and PROJECT_LOGO name). The favicon is a
# favicon.ico, which browsers fetch unasked: Docsy's favicons.html looks for its files in the
# site's own static/ (os.FileExists), not in mounts, so it links none of pdi-static/.
module:
  mounts:
    - source: assets
      target: assets
    - source: pdi-assets
      target: assets
    - source: static
      target: static
    - source: pdi-static
      target: static

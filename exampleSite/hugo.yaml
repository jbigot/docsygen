baseURL: https://example.org/
title: docsygen example
locale: en

module:
  proxy: direct
  hugoVersion:
    extended: true
    min: 0.160.1
  imports:
    - path: github.com/jbigot/docsygen
    - path: github.com/docsy/docsy/theme

menu:
  main:
    - name: Documentation
      pageRef: /docs/
      weight: 10

outputs:
  section: [HTML, RSS, print]

params:
  offlineSearch: true
  ui:
    # Docsy's light/dark menu in the navbar.
    showLightDarkModeMenu: true
    sidebar_menu_compact: true
    # docsygen makes each version root its own sidebar root (sidebar_root_for).
    sidebar_root_enabled: true
    # Not sidebar_menu_truncate: Hugo (≥ 0.152) reads YAML integers as uint64, and Docsy 0.18's
    # sidebar-tree.html then warns that 18446744073709550… entries were truncated. PDI's sections
    # stay under its default of 100 entries.

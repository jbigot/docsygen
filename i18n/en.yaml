# The words of the generated reference. A site rewords or translates them in its own
# i18n/<lang>.yaml, keeping the keys: docsygen-<the English text, in lowercase and hyphens>, one
# per kind of section for the headings. The arguments are named fields ({{ .name }}), and
# the plural forms (one, other) depend on .count. A key left out of a site's file keeps the
# default language's wording. Doxygen's own wording, from translator_en.h, is the model.

# Page titles and the titles of the lists (Doxygen's translator_en.h); a title with a name takes
# {{ .name }}.
docsygen-class-reference: "{{ .name }} Class Reference"
docsygen-class-template-reference: "{{ .name }} Class Template Reference"
docsygen-struct-reference: "{{ .name }} Struct Reference"
docsygen-struct-template-reference: "{{ .name }} Struct Template Reference"
docsygen-union-reference: "{{ .name }} Union Reference"
docsygen-union-template-reference: "{{ .name }} Union Template Reference"
docsygen-interface-reference: "{{ .name }} Interface Reference"
docsygen-interface-template-reference: "{{ .name }} Interface Template Reference"
docsygen-protocol-reference: "{{ .name }} Protocol Reference"
docsygen-protocol-template-reference: "{{ .name }} Protocol Template Reference"
docsygen-category-reference: "{{ .name }} Category Reference"
docsygen-category-template-reference: "{{ .name }} Category Template Reference"
docsygen-exception-reference: "{{ .name }} Exception Reference"
docsygen-exception-template-reference: "{{ .name }} Exception Template Reference"
docsygen-namespace-reference: "{{ .name }} Namespace Reference"
docsygen-file-reference: "{{ .name }} File Reference"
docsygen-directory-reference: "{{ .name }} Directory Reference"
docsygen-concept-reference: "{{ .name }} Concept Reference"
docsygen-documentation: "{{ .project }} Documentation"
docsygen-class-hierarchy: Class Hierarchy
docsygen-file-list: File List
docsygen-related-pages: Related Pages
docsygen-class-members: Class Members
docsygen-topics: Topics
docsygen-examples: Examples
docsygen-pages: Pages
docsygen-files: Files
docsygen-api-reference: API reference
docsygen-api: API
docsygen-indexes: Indexes
docsygen-other: Other

# The headings of the detailed sections (doc-…) of a page, by kind; -c: a class's variables with
# OPTIMIZE_OUTPUT_FOR_C.
docsygen-section-doc-define: Macros
docsygen-section-doc-typedef: Typedefs
docsygen-section-doc-enum: Enums
docsygen-section-doc-function: Functions
docsygen-section-doc-friend: Friends
docsygen-section-doc-related: Related
docsygen-section-doc-variable: Variables
docsygen-section-doc-variable-c: Fields
docsygen-section-doc-property: Properties
docsygen-section-doc-event: Events

# The other headings of a page.
docsygen-detailed-description: Detailed Description
docsygen-concept-definition: Concept definition
docsygen-class-documentation: Class Documentation
docsygen-source: Source

# The heading of an overload set, and of a variable template's specializations, in the detailed
# documentation; .name is HTML, built and escaped by docsygen (the name, as code).
docsygen-overloads: "{{ .name }} overloads"
docsygen-specializations: "{{ .name }} specializations"

# The lists of declarations: the size of an overload set or of a variable template's
# specializations, the labels over the lists, and the name of an anonymous namespace. The base of
# docsygen-list-inherited-from and docsygen-list-inherited-labelled is HTML, built and escaped by
# docsygen (a link); the label of the latter is one of docsygen-list-static to -related.
docsygen-list-overloads:
  one: "({{ .count }} overload)"
  other: "({{ .count }} overloads)"
docsygen-list-specializations:
  one: "(+{{ .count }} specialization)"
  other: "(+{{ .count }} specializations)"
docsygen-list-static: static
docsygen-list-protected: protected
docsygen-list-private: private
docsygen-list-package: package
docsygen-list-related: related
docsygen-list-inherited-from: "inherited from {{ .base }}"
docsygen-list-inherited-labelled: "{{ .label }}, inherited from {{ .base }}"
docsygen-anonymous: (anonymous)

# The titles of the blocks of a description: the simple sections (@see, @return, …), the parameter
# lists, and the value of a variable or an enumerator.
docsygen-see-also: See also
docsygen-returns: Returns
docsygen-author: Author
docsygen-authors: Authors
docsygen-version: Version
docsygen-since: Since
docsygen-date: Date
docsygen-note: Note
docsygen-warning: Warning
docsygen-precondition: Precondition
docsygen-postcondition: Postcondition
docsygen-copyright: Copyright
docsygen-invariant: Invariant
docsygen-remarks: Remarks
docsygen-attention: Attention
docsygen-important: Important
docsygen-parameters: Parameters
docsygen-return-values: Return values
docsygen-exceptions: Exceptions
docsygen-template-parameters: Template Parameters
docsygen-value: "Value:"
docsygen-initial-value: "Initial value:"
docsygen-enumerator: Enumerator

# Sentences. The text is HTML, and so are the arguments, built and escaped by docsygen (with links):
# file, line, list, name, section, base, member, scope.
docsygen-definition-at-line: "Definition at line {{ .line }} of file {{ .file }}."
docsygen-definition-in-file: "Definition in file {{ .file }}."
docsygen-implements: "Implements {{ .list }}."
docsygen-reimplemented-from: "Reimplemented from {{ .list }}."
docsygen-implemented-in: "Implemented in {{ .list }}."
docsygen-reimplemented-in: "Reimplemented in {{ .list }}."
docsygen-inheritance-diagram-for: "Inheritance diagram for {{ .name }}:"
docsygen-go-to-the-documentation-of-this-file: Go to the documentation of this file.
docsygen-go-to-the-source-code-of-this-file: Go to the source code of this file.
docsygen-source-link: source
docsygen-list-separator: ", "
docsygen-list-last-separator: ", and "

# The footer of a class's page, by kind of class: one file or several.
docsygen-generated-from-class:
  one: "The documentation for this class was generated from the following file:"
  other: "The documentation for this class was generated from the following files:"
docsygen-generated-from-struct:
  one: "The documentation for this struct was generated from the following file:"
  other: "The documentation for this struct was generated from the following files:"
docsygen-generated-from-union:
  one: "The documentation for this union was generated from the following file:"
  other: "The documentation for this union was generated from the following files:"
docsygen-generated-from-interface:
  one: "The documentation for this interface was generated from the following file:"
  other: "The documentation for this interface was generated from the following files:"
docsygen-generated-from-protocol:
  one: "The documentation for this protocol was generated from the following file:"
  other: "The documentation for this protocol was generated from the following files:"
docsygen-generated-from-category:
  one: "The documentation for this category was generated from the following file:"
  other: "The documentation for this category was generated from the following files:"
docsygen-generated-from-exception:
  one: "The documentation for this exception was generated from the following file:"
  other: "The documentation for this exception was generated from the following files:"

# The latest release's title in the version menu and the sidebar, from its version label.
docsygen-latest-version: "latest ({{ .version }})"

# The notice above the pages of versions other than the latest (docsygen/notice.html). The text
# is Markdown; the arguments are HTML-escaped: project (Doxygen's PROJECT_NAME), version (the
# page's version), latest (the latest release) and url (the same page in the latest release, or
# its root).
docsygen-notice-older: >-
  This is the documentation of {{ .project }} {{ .version }}, an older release.
  See [this page in the latest release, {{ .latest }}]({{ .url }}).
docsygen-notice-main: >-
  This is the documentation of {{ .project }}'s development version ({{ .version }}), which is
  not released yet. See [this page in the latest release, {{ .latest }}]({{ .url }}).

# What Doxygen 1.16 and 1.17 added to the XML: a concept's parts (1.16), Mermaid diagrams (1.17).
# The XML is Doxygen 1.17.0's, of fixtures/doxygen-1.17/a.h: run doxygen there and copy index.xml,
# a_8h.xml, conceptSized.xml and flow.mmd (the copy that Doxygen writes next to the XML for
# \mermaidfile) from xml/.
- name: docsy markup, a mermaid diagram file read from the XML directory, with its caption
  partial: test/doc.html
  context:
    ctx: {model: doxygen-1.17}
    xml: "<detaileddescription><para><mermaidfile name=\"flow.mmd\">File caption</mermaidfile>\n </para></detaileddescription>"
  expect: "<figure class=\"docsygen-figure\"><pre class=\"mermaid\">graph TD\n  X --&gt; Y\n</pre><figcaption>File caption</figcaption></figure>"
- name: docsy markup, a mermaid diagram for Docsy's Mermaid plugin
  partial: test/doc.html
  context:
    ctx: {}
    xml: "<detaileddescription><para><mermaid caption=\"Flow caption\">graph LR\n  A --&gt; B</mermaid>\n</para></detaileddescription>"
  expect: "<figure class=\"docsygen-figure\"><pre class=\"mermaid\">graph LR\n  A --&gt; B</pre><figcaption>Flow caption</figcaption></figure>"
- name: docsy markup, a mermaid diagram file without a caption
  partial: test/doc.html
  context:
    ctx: {model: doxygen-1.17}
    xml: "<detaileddescription><para><mermaidfile name=\"flow.mmd\"></mermaidfile>\n </para></detaileddescription>"
  expect: "<figure class=\"docsygen-figure\"><pre class=\"mermaid\">graph TD\n  X --&gt; Y\n</pre></figure>"
- name: docsy markup, concept parts, code and an embedded description
  partial: test/block-contains.html
  context:
    ctx: {model: doxygen-1.17}
    block: {type: concept-definition, id: conceptSized}
    contains:
      - '<div class="docsygen-embeddoc" style="margin-left:2ch">'
      - '<p>The size of a value. </p>'
      - 't.size();'
    lacks: ['Sized =  requires']
  expect: []
- name: docsy markup, a mermaid caption is plain text, as in Doxygen's HTML
  partial: test/doc.html
  context:
    ctx: {}
    xml: "<detaileddescription><para><mermaid caption=\"A &lt;b&gt;bold&lt;/b&gt; and **md** caption\">graph LR</mermaid>\n</para></detaileddescription>"
  expect: "<figure class=\"docsygen-figure\"><pre class=\"mermaid\">graph LR</pre><figcaption>A &lt;b&gt;bold&lt;/b&gt; and **md** caption</figcaption></figure>"

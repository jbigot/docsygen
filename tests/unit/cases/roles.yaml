- name: roles of the sample, a source page per header
  partial: test/roles.html
  context:
    model: sample
    match: {role: source}
  len: true
  expect: 8
- name: roles of the sample, the members list of a class
  partial: test/roles.html
  context:
    model: sample
    match: {role: all-members, id: classdemo_1_1Widget}
  expect: [{role: all-members, id: classdemo_1_1Widget}]

- name: skeleton of the guide, a section heading before its block
  partial: test/skeleton.html
  context:
    model: sample
    key: pages/guide
    contains: ["## First section {#first-section}\n\n{{< docsygen/block n="]
  expect: []
- name: skeleton of a page, Markdown characters of a section title escaped
  partial: test/skeleton.html
  context:
    model: sample
    key: pages/escapes
    contains: ["## A section titled a\\*b\\, \\[c\\] and \\#d {#"]
  expect: []
- name: skeleton of a class, a member heading before its block
  partial: test/skeleton.html
  context:
    model: sample
    key: api/demo/widget
    contains: ["### resize {#resize}\n\n{{< docsygen/block n="]
  expect: []
- name: skeleton of a class, no title block
  partial: test/skeleton.html
  context:
    model: sample
    key: api/demo/widget
    contains: ["{{< docsygen/block n=0 >}}"]
  expect: ["{{< docsygen/block n=0 >}}"]
- name: skeleton of a class, a heading block is its Markdown heading only
  partial: test/skeleton.html
  context:
    model: sample
    key: api/demo/widget
    contains: ["## Member Function Documentation {#doc-function}\n\n### "]
  expect: []

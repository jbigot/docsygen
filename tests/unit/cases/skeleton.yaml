- name: skeleton of the guide, a section heading before its block
  partial: test/skeleton.html
  context:
    model: sample
    key: pages/guide
    contains: ["## First section {#first-section}\n\n{{% docsygen/part id=\"guide_1first-section\" part=\"section\" %}}"]
  expect: []
- name: skeleton of a page, Markdown characters of a section title escaped
  partial: test/skeleton.html
  context:
    model: sample
    key: pages/escapes
    contains: ["## A section titled a\\*b\\, \\[c\\] and \\#d {#"]
  expect: []
- name: skeleton of a class, a member heading, its declaration, before its block
  partial: test/skeleton.html
  context:
    model: sample
    key: api/demo/widget
    contains: ["### <code class=\"docsygen-declaration chroma bg-transparent text-body\"><strong>measure</strong>", "{#measure .border-top .pt-3 .mt-4 .fs-5 .fw-normal}\n\n{{% docsygen/member id=\"classdemo_1_1Widget_1a130372656d7b406e5a77a1859acc8ceb\" %}}"]
  expect: []
- name: skeleton writes heading classes as attributes, none on a section heading
  partial: test/skeleton.html
  context:
    model: sample
    key: api/demo/widget
    contains: ["## Functions {#doc-function}\n\n### ", " {#resize .border-top .pt-3 .mt-4 .fs-5 .fw-normal}\n\n"]
  expect: []
- name: skeleton of a class, anchor of each overload in a set, the set's on its heading
  partial: test/skeleton.html
  context:
    model: sample
    key: api/demo/widget
    contains:
      - "### <span class=\"d-block\"><code class=\"docsygen-declaration chroma bg-transparent text-body\"><strong>resize</strong>"
      - "</code></span> <a id=\"resize-1\"></a><code class=\"docsygen-declaration chroma bg-transparent text-body\"><strong>resize</strong>"
      - "</code> {#resize .border-top .pt-3 .mt-4 .fs-5 .fw-normal}\n\n{{% docsygen/member id=\"classdemo_1_1Widget_1ab22d0f24e83705f3bb0a847888da84cd\" %}}\n\n{{% docsygen/member id=\"classdemo_1_1Widget_1aa038e7bf4d6f3abd216f8fd94a5d5bca\" %}}"
  expect: []
- name: skeleton of a class, no title block
  partial: test/skeleton.html
  context:
    model: sample
    key: api/demo/widget
    contains: ["part=\"title\""]
  expect: ["part=\"title\""]
- name: skeleton of a class, a heading block is its Markdown heading only

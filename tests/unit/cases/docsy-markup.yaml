- name: docsy markup, a block image is a figure
  partial: test/doc.html
  context:
    ctx: {}
    xml: '<detaileddescription><para><image type="html" name="https://example.com/a.png">The caption</image></para></detaileddescription>'
  expect: '<figure class="figure"><img src="https://example.com/a.png" alt="The caption"><figcaption class="figure-caption">The caption</figcaption></figure>'
- name: docsy markup, an inline image
  partial: test/doc.html
  context:
    ctx: {}
    xml: '<detaileddescription><para>See <image type="html" name="https://example.com/a.png" inline="yes">A</image> here.</para></detaileddescription>'
  expect: '<p>See <img src="https://example.com/a.png" alt="A"> here.</p>'
- name: docsy markup, an image of the XML directory is published at its asset path
  partial: test/doc.html
  context:
    ctx: {model: sample}
    xml: '<detaileddescription><para><image type="html" name="diagram.png">The caption</image></para></detaileddescription>'
  expect: '<figure class="figure"><img src="/doxygen/sample/diagram.png" alt="The caption"><figcaption class="figure-caption">The caption</figcaption></figure>'
- name: docsy markup, an image's alt text is escaped
  partial: test/doc.html
  context:
    ctx: {}
    xml: '<detaileddescription><para>See <image type="html" name="https://example.com/a b.png" inline="yes">a [b] c</image> here.</para></detaileddescription>'
  expect: '<p>See <img src="https://example.com/a%20b.png" alt="a [b] c"> here.</p>'
- name: docsy markup, a section in a member's documentation
  partial: test/doc.html
  context:
    ctx: {anchors: {x_1s: s}}
    xml: '<detaileddescription><para>Intro.</para><sect1 id="x_1s"><title>T</title><para>Body.</para></sect1></detaileddescription>'
  expect: '<p>Intro.</p><h4 id="s">T</h4><p>Body.</p>'
- name: docsy markup, a section in a member's documentation is a Markdown heading
  partial: test/doc.html
  context:
    ctx: {anchors: {x_1s: s}}
    mdheadings: true
    xml: '<detaileddescription><para>Intro.</para><sect2 id="x_1s"><title>T <computeroutput>f*</computeroutput></title><para>Body.</para></sect2></detaileddescription>'
  expect: "<p>Intro.</p>\uE000##### T `f*` {#s}\uE001<p>Body.</p>"
- name: docsy markup, a heading in a table cell stays HTML
  partial: test/doc.html
  context:
    ctx: {}
    mdheadings: true
    xml: '<detaileddescription><para><table rows="1" cols="1"><row><entry thead="no"><para><heading level="3">H</heading></para></entry></row></table></para></detaileddescription>'
  expect: '<table><tr><td><h3>H</h3></td></tr></table>'
- name: docsy markup, a checklist is a list of goldmark's task items
  partial: test/doc.html
  context:
    ctx: {}
    xml: '<detaileddescription><para><itemizedlist><listitem override="checked"><para>a</para></listitem><listitem override="unchecked"><para>b</para></listitem></itemizedlist></para></detaileddescription>'
  expect: '<ul><li><input checked="" disabled="" type="checkbox"> a</li><li><input disabled="" type="checkbox"> b</li></ul>'

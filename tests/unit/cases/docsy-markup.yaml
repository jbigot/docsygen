- name: docsy markup, a warning is an alert
  partial: test/doc.html
  context:
    ctx: {}
    xml: '<detaileddescription><para><simplesect kind="warning"><para>Be careful.</para></simplesect></para></detaileddescription>'
  expect: '<div class="alert alert-warning" role="alert"><div class="h4 alert-heading" role="heading">Warning</div><div>Be careful.</div></div>'
- name: docsy markup, two notes in a row are one alert
  partial: test/doc.html
  context:
    ctx: {}
    xml: '<detaileddescription><para><simplesect kind="note"><para>One.</para></simplesect><simplesect kind="note"><para>Two.</para></simplesect></para></detaileddescription>'
  expect: '<div class="alert alert-info" role="alert"><div class="h4 alert-heading" role="heading">Note</div><div>One.</div><div>Two.</div></div>'
- name: docsy markup, a parameter list is a definition list
  partial: test/doc.html
  context:
    ctx: {}
    xml: '<detaileddescription><para><parameterlist kind="param"><parameteritem><parameternamelist><parametername direction="in">x</parametername></parameternamelist><parameterdescription><para>The x.</para></parameterdescription></parameteritem></parameterlist></para></detaileddescription>'
  expect: '<dl class="docsygen-params"><dt>Parameters</dt><dd><dl class="docsygen-param-items"><dt><code>x</code> <span class="small text-body-secondary">[in]</span></dt><dd>The x.</dd></dl></dd></dl>'
- name: docsy markup, a returns section is a definition list
  partial: test/doc.html
  context:
    ctx: {}
    xml: '<detaileddescription><para><simplesect kind="return"><para>The result.</para></simplesect></para></detaileddescription>'
  expect: '<dl class="docsygen-return"><dt>Returns</dt><dd>The result.</dd></dl>'
- name: docsy markup, an xref item is a definition list
  partial: test/doc.html
  context:
    ctx: {}
    xml: '<detaileddescription><para><xrefsect id="todo_1_todo000001"><xreftitle>Todo</xreftitle><xrefdescription><para>Fix it.</para></xrefdescription></xrefsect></para></detaileddescription>'
  expect: '<dl class="docsygen-xref docsygen-todo"><dt>Todo</dt><dd>Fix it.</dd></dl>'
- name: docsy markup, a listing is a fenced code block
  partial: test/doc-contains.html
  context:
    ctx: {}
    xml: '<detaileddescription><para><programlisting filename=".txt"><codeline><highlight class="keyword">int</highlight><highlight class="normal"><sp/>a;</highlight></codeline><codeline><highlight class="normal"></highlight></codeline></programlisting></para></detaileddescription>'
    contains: ['class="highlight"', 'int a;']
    lacks: [docsygen-listing, docsygen-line, 'id="l-']
  expect: []
- name: docsy markup, a numbered listing starts at its first line
  partial: test/listing-contains.html
  context:
    ctx: {}
    numbered: true
    lang: cpp
    xml: '<programlisting><codeline lineno="12"><highlight class="normal">int<sp/>a;</highlight></codeline><codeline lineno="13"><highlight class="normal">int<sp/>b;</highlight></codeline></programlisting>'
    contains: ['id="l-12"', 'id="l-13"', 'href="#l-12"']
    lacks: ['id="l-11"', 'id="l-14"']
  expect: []
- name: docsy markup, a listing with a line of backticks keeps its following lines
  partial: test/listing-contains.html
  context:
    ctx: {}
    numbered: true
    lang: cpp
    xml: '<programlisting><codeline lineno="1"><highlight class="normal">a;</highlight></codeline><codeline lineno="2"><highlight class="normal">```</highlight></codeline><codeline lineno="3"><highlight class="normal">b;</highlight></codeline></programlisting>'
    contains: ['id="l-1"', 'id="l-3"', 'b;']
    lacks: ['<p>', '<code>b;']
  expect: []
- name: render, the text of a listing
  partial: test/call-with-node.html
  context:
    call: docsygen/render/listing-text.html
    xml: '<programlisting><codeline><highlight class="normal">a<sp/><ref refid="x" kindref="member">b</ref></highlight></codeline><codeline><highlight class="normal"><sp value="9"/>c</highlight></codeline></programlisting>'
  expect: "a b\n\tc"
- name: docsy markup, an inline formula through KaTeX
  partial: test/doc-contains.html
  context:
    ctx: {}
    xml: '<detaileddescription><para>Inline <formula id="0">$ a^2 $</formula>.</para></detaileddescription>'
    contains: ['class="katex"', '<annotation encoding="application/x-tex">a^2</annotation>']
    lacks: ['katex-display', '$']
  expect: []
- name: docsy markup, a display formula through the math hook
  partial: test/doc-contains.html
  context:
    ctx: {}
    xml: '<detaileddescription><para><formula id="1">\[ x \]</formula></para></detaileddescription>'
    contains: ['<pre data-test-hook="math">x</pre>']
    lacks: ['\[', 'katex']
  expect: []
- name: docsy markup, a formula environment through the math hook
  partial: test/doc-contains.html

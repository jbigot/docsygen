- name: plan of a class starts with its title and summary links
  partial: test/plan.html
  context:
    ctx: {model: sample}
    key: api/demo/widget
    n: 2
  expect: [{type: title, text: demo::Widget Class Reference}, {type: summary-links, text: ""}]
- name: plan, a class page has no brief block
  partial: test/plan-types.html
  context:
    ctx: {model: sample}
    key: api/demo/widget
    type: brief
  expect: []
- name: plan, a class whose inherited members all join its own sections has no additional ones
  partial: test/plan-keys.html
  context:
    ctx: {model: sample}
    key: api/demo/circle
    type: decls
  expect: [public-func, public-attrib]
- name: plan, a class that inherits into a section it lacks has additional inherited members
  partial: test/plan-keys.html
  context:
    ctx: {model: sample}
    key: api/demo/labelledcircle
    type: decls
  expect: [public-func, inherited]
- name: sections of a class, summaries before detailed sections
  partial: test/section-keys.html
  context:
    model: sample
    id: classdemo_1_1Widget
  expect: [public-func, public-static-func, public-attrib, public-static-attrib, protected-attrib, private-attrib,
    friend, related, user-defined-1, doc-constructor, doc-function, doc-related, doc-variable]
- name: sections of a namespace
  partial: test/section-keys.html
  context:
    model: sample
    id: namespacedemo
  expect: [inner-namespace, inner-class, inner-concept, enum, func, var, doc-enum, doc-function, doc-variable]
- name: title of a class template
  partial: docsygen/plan/title.html
  context:
    model: sample
    id: classdemo_1_1Box
  expect: {text: "demo::Box< T, N > Class Template Reference", labels: []}
- name: title of an abstract class
  partial: docsygen/plan/title.html
  context:
    model: sample
    id: classdemo_1_1Widget
  select: [labels]
  expect: [abstract]
- name: groups of a struct in a subgroup
  partial: docsygen/plan/groups.html
  context:
    model: sample-c
    id: structcpoint
  expect: [{id: group__cdemo__shapes, groups: [{id: group__cdemo, groups: []}]}]
- name: a constructor
  partial: docsygen/plan/constructor.html
  context: {model: sample, id: classdemo_1_1Widget_1ad56d53bd603a1d81a5ad3623f5f873a8}
  expect: constructor
- name: a destructor
  partial: docsygen/plan/constructor.html
  context: {model: sample, id: classdemo_1_1Widget_1a34affe2d9f733dcb811f492d468a005d}
  expect: destructor
- name: a method is no constructor
  partial: docsygen/plan/constructor.html
  context: {model: sample, id: classdemo_1_1Widget_1ab22d0f24e83705f3bb0a847888da84cd}
  expect: ""
- name: a function out of classes is no constructor
  partial: docsygen/plan/constructor.html
  context: {model: sample, id: namespacedemo_1_1markup_1a234be6a6bd4c19f58c5be2c2d0afcab5}
  expect: ""
- name: argsstring with nested parentheses and noexcept
  partial: docsygen/plan/argsstring.html
  context: "(int (*f)(int), char c='(') const noexcept(true)"
  expect: {params: "(int (*f)(int), char c='(')", rest: " const noexcept(true)"}
- name: argsstring of a variable
  partial: docsygen/plan/argsstring.html
  context: "[3]"
  expect: {params: "", rest: "[3]"}
- name: files that declare a class
  partial: docsygen/plan/class-files.html
  context: {model: sample, id: classdemo_1_1Shape}
  expect: [shapes_8hpp]
- name: a class without files
  partial: docsygen/plan/class-files.html
  context: {model: sample, id: namespacedemo}
  expect: []
- name: the examples that use a member
  partial: docsygen/plan/examples.html
  context: {model: sample}
  select: [uses, classdemo_1_1Widget_1ab22d0f24e83705f3bb0a847888da84cd]
  expect: [{example: example_8cpp-example, line: 6}]
- name: SORT_MEMBER_DOCS sorts as Hugo's sort does, a destructor next to its constructor
  partial: docsygen/plan/sections.html
  context: {model: sample, id: classdemo_1_1Widget}
  select: [9, members]
  expect: [classdemo_1_1Widget_1a34affe2d9f733dcb811f492d468a005d, classdemo_1_1Widget_1ad56d53bd603a1d81a5ad3623f5f873a8,
    classdemo_1_1Widget_1ac55324e57d7ec9c79000c44e232af788, classdemo_1_1Widget_1afe72a4d5472594d31c874d526806eec9]

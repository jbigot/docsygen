- name: plan of a class starts with its title and summary links
  partial: test/plan.html
  context:
    ctx: {model: sample}
    key: api/demo/widget
    n: 2
  expect: [{type: title, text: demo::Widget Class Reference}, {type: summary-links, text: ""}]
- name: plan, a class page has no brief block
  partial: test/plan-types.html
  context:
    ctx: {model: sample}
    key: api/demo/widget
    type: brief
  expect: []
- name: plan, a class's plan ends with generated-from
  partial: test/plan-has.html
  context:
    ctx: {model: sample}
    key: api/demo/widget
    type: generated-from
  expect: true
- name: plan, no generated-from under SHOW_USED_FILES=NO
  partial: test/plan-has.html

  expect: [type, function, '- function cdemo_finalize', '- function cdemo_init', '- function cdemo_reset',
    '- function cdemo_version', variable, macro, '- macro CDEMO_VERSION', '- macro CMAX(a, b)', '- macro CMIN(a, b)',
    namespace, '- namespace demo::']

- name: list of a namespace, kinds in order
  partial: test/list.html
  context: {model: sample, id: namespacedemo, match: '^[^- ]'}
  expect: [concept, type, function, variable, Lookup function, namespace]
- name: list of a namespace, its sub-namespaces
  partial: test/list.html
  context: {model: sample, id: namespacedemo, subs: true}
  expect: [namespacedemo_1_1io, namespacedemo_1_1markup]
- name: list sorts types by name across kinds
  partial: test/list.html
  context: {model: sample, id: namespacedemo, only: type, flat: true}
  expect: ['- class Box<typename T, int N>', '- class Button', '- class Circle', '- enum Color', '- class Diamond',
    '- class Escapes', '- class Foo<int>', '- class Foo<typename T *>', '- class Foo<typename T>', '- class Gadget', '- class Gizmo',
    '- class LabelledCircle', '- class Left', '- enum Level', '- class Named', '- class Outer', '- class Right',
    '- class Shape', '- class widget', '- class Widget']
- name: list of a namespace, functions with their overload sets
  partial: test/list.html
  context: {model: sample, id: namespacedemo, only: function}
  expect: ['- function box', '- function make_widget', '- function scale (2 overloads)', '- function to_string (2 overloads) +']
- name: list counts a variable template's specializations
  partial: test/list.html
  context: {model: sample, id: namespacedemo, only: variable}

- name: variants, every group of the sample's page
  partial: test/variants.html
  context:
    ctx: {model: sample}
    id: variants
    all: true
  expect: ['sample_ex: C Fortran', 'sample_shared: C Fortran', 'sample_pb: C Fortran', 'sample_inc: C Fortran', 'sample_item: C Fortran']

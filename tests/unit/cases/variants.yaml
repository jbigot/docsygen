- name: variants, every group of the sample's page
  partial: test/variants.html
  context:
    ctx: {model: sample}
    id: variants
    all: true
  # sample_pbg's anchor starts its first variant's parblock, which, looked into alone, also starts
  # a group: rendering never looks for groups inside a variant (docsygen/markup/doc-children.html).
  expect: ['sample_ex: C Fortran', 'sample_shared: C Fortran', 'sample_pb: C Fortran', 'sample_inc: C Fortran', 'sample_pbg: C Fortran', 'sample_item: C Fortran', 'sample_pbg: C']
- name: variants, a group in a member's description
  partial: test/variants.html
  context:
    ctx: {model: sample}
    id: namespacedemo_1ad4e100aff6c2651a2ecbefa8bcefe5a2
    all: true
  expect: ['sample_member: C Fortran']
# docsygen/markup/doc.html renders the groups: as Docsy's tabs where the site has its tabpane
# (tests/docsy/check_docsy.py), else, as on this site, as the children in sequence.
- name: variants, without tabpane, a group renders as its children in sequence
  partial: test/doc-contains.html
  context:
    ctx: {model: sample}
    xml: '<detaileddescription><para><itemizedlist><listitem><para>Step two, in two languages. <anchor id="variants_1sample_item"/><anchor id="variants_1sample_item-C"/> C source code: <programlisting filename=".C"><codeline><highlight class="normal">a;</highlight></codeline></programlisting> <anchor id="variants_1sample_item-Fortran"/> Fortran source code: <programlisting filename=".f"><codeline><highlight class="normal">b</highlight></codeline></programlisting></para></listitem></itemizedlist></para></detaileddescription>'
    contains: ['<li>Step two, in two languages. <a id=""></a><a id=""></a> C source code: <div class="highlight">', '</div> <a id=""></a> Fortran source code: <div class="highlight">']
    lacks: [nav-tabs, tab-pane]
  expect: []

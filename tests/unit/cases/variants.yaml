- name: variants, a variant is its parblock
  partial: test/variants.html
  context:
    ctx: {model: sample}
    xml: "<detaileddescription><para><anchor id=\"variants_1sample_pb\"/><parblock><para><anchor id=\"variants_1sample_pb-C\"/>C source code: <programlisting><codeline/></programlisting></para>\n<para>is the same as: <programlisting><codeline/></programlisting> </para>\n</parblock></para>\n<para><parblock><para><anchor id=\"variants_1sample_pb-Fortran\"/>Fortran source code: <programlisting><codeline/></programlisting></para>\n<para>is the same as: <programlisting><codeline/></programlisting> </para>\n</parblock></para>\n</detaileddescription>"
  expect:
    - '0-2 group sample_pb variants_1sample_pb'
    - '  C variants_1sample_pb-C: {[pb {#variants_1sample_pb-C C source code: [code]} {is the same as: [code]}]}'
    - '  Fortran variants_1sample_pb-Fortran: {[pb {#variants_1sample_pb-Fortran Fortran source code: [code]} {is the same as: [code]}]}'
    - '3-3 _'
- name: variants, a parblock not at its paragraph's start is the variant alone
  partial: test/variants.html
  context:
    ctx: {model: sample}
    xml: '<detaileddescription><para>Before <anchor id="variants_1sample_pb"/><parblock><para><anchor id="variants_1sample_pb-C"/>C <programlisting><codeline/></programlisting></para></parblock>After.</para></detaileddescription>'

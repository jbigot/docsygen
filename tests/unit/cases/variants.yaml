# docsygen/markup/variants.html, through test/variants.html: the anchor ids are the sample's
# (page variants), which the model names.
- name: variants, two variants make a group, labels C and Fortran
  partial: test/variants.html
  context:
    ctx: {model: sample}
    xml: "<detaileddescription><para>Intro.</para>\n<para><anchor id=\"variants_1sample_ex\"/><anchor id=\"variants_1sample_ex-C\"/>C source code: <programlisting filename=\".C\"><codeline/></programlisting></para>\n<para><anchor id=\"variants_1sample_ex-Fortran\"/>Fortran source code: <programlisting filename=\".f\"><codeline/></programlisting></para>\n</detaileddescription>"
  expect:
    - '0-0 {Intro.}'
    - '1-1 _'
    - '2-4 group sample_ex variants_1sample_ex'
    - '  C variants_1sample_ex-C: {#variants_1sample_ex-C C source code: [code]}'
    - '  Fortran variants_1sample_ex-Fortran: {#variants_1sample_ex-Fortran Fortran source code: [code]}'
    - '5-5 _'
- name: variants, a paragraph after a group stays outside it
  partial: test/variants.html
  context:
    ctx: {model: sample}
    xml: '<detaileddescription><para><anchor id="variants_1sample_ex"/><anchor id="variants_1sample_ex-C"/>C <programlisting><codeline/></programlisting></para><para><anchor id="variants_1sample_ex-Fortran"/>F <programlisting><codeline/></programlisting></para><para>After.</para></detaileddescription>'
  expect:
    - '0-1 group sample_ex variants_1sample_ex'
    - '  C variants_1sample_ex-C: {#variants_1sample_ex-C C [code]}'
    - '  Fortran variants_1sample_ex-Fortran: {#variants_1sample_ex-Fortran F [code]}'
    - '2-2 {After.}'
- name: variants, second group on the page is its own group
  partial: test/variants.html
  context:
    ctx: {model: sample}
    xml: '<detaileddescription><para><anchor id="variants_1sample_ex"/><anchor id="variants_1sample_ex-C"/>C <programlisting><codeline/></programlisting></para><para><anchor id="variants_1sample_ex-Fortran"/>F <programlisting><codeline/></programlisting></para><para><anchor id="variants_1sample_shared"/><anchor id="variants_1sample_shared-C"/>C <programlisting><codeline/></programlisting> <anchor id="variants_1sample_shared-Fortran"/>F <programlisting><codeline/></programlisting></para></detaileddescription>'
  expect:
    - '0-1 group sample_ex variants_1sample_ex'
    - '  C variants_1sample_ex-C: {#variants_1sample_ex-C C [code]}'
    - '  Fortran variants_1sample_ex-Fortran: {#variants_1sample_ex-Fortran F [code]}'
    - '2-2 group sample_shared variants_1sample_shared'
    - '  C variants_1sample_shared-C: {#variants_1sample_shared-C C [code]}'
    - '  Fortran variants_1sample_shared-Fortran: {#variants_1sample_shared-Fortran F [code]}'
- name: variants, dashed anchor without group is no variant
  partial: test/variants.html
  context:
    ctx: {model: sample}
    xml: '<detaileddescription><para>Text.</para><para><anchor id="variants_1plain-dashed"/><programlisting><codeline/></programlisting></para><para><anchor id="variants_1sample_shared"/><anchor id="variants_1sample_ex-C"/>C <programlisting><codeline/></programlisting></para></detaileddescription>'

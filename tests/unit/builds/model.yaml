- name: model of a directory without index.xml
  partial: docsygen/model.html
  context: doxygen/nope
  error: "docsygen: no index.xml in assets/doxygen/nope"
- name: unknown entity
  partial: docsygen/render/entity.html
  context: nosuch
  warning: 'docsygen: unknown Doxygen entity "nosuch"'
- name: a part that the version lacks
  partial: test/part.html
  context: {model: sample, address: {type: brief, id: nope}}
  error: 'docsygen: no part {"id":"nope","type":"brief"} in version sample'

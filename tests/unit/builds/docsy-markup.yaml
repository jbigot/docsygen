- name: a render-codeblock hook that drops the line anchors of a numbered listing warns
  partial: test/listing-contains.html
  context:
    ctx: {}
    numbered: true
    lang: cpp
    xml: '<programlisting><codeline lineno="12"><highlight class="normal">int<sp/>a;</highlight></codeline></programlisting>'
    contains: []
    lacks: []
  mounts: {fixtures/listing-hook: layouts}
  warning: 'a listing has no line anchors (id="l-12")'
- name: a display formula KaTeX rejects warns and shows its source
  partial: test/doc-contains.html
  context:
    ctx: {}
    xml: '<detaileddescription><para><formula id="3">\begin{eqnarray*} a &amp;=&amp; b \end{eqnarray*}</formula></para></detaileddescription>'
    contains: ['<code>\begin{eqnarray*} a &amp;=&amp; b \end{eqnarray*}</code>']
    lacks: ['data-test-hook']
  warning: 'docsygen: formula'

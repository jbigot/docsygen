# What Doxygen's HTML shows and its XML doesn't give, removed from the Doxygen side before the
# comparison: see tests/oracle/htmltree.py. The user approves each entry.
- oracle: sample
  pages: "*"
  select: div.ttc
  count: 106
  reason: "The tooltips that follow a code fragment repeat a symbol's name, declaration, brief and definition, but which fragments get them depends on the state of Doxygen's code parser (once per output file, yet missing on some pages that link the symbol), and an enum value's line isn't in the XML"
  evidence: "First_steps.xml links PDI_expose (group__annotation_1gae809befdb9bde9abad07a9e0eab894d7) in code, and First_steps.html links it without its tooltip, which how_to_create_plugin.html has; <enumvalue> has no <location>"
- oracle: sample-c
  pages: "*"
  select: div.ttc
  count: 14
  reason: "See the sample entry (all of sample-c's tooltips are on its source listing)"
  evidence: "see the sample entry"
- oracle: pdi
  pages: "*"
  select: div.ttc
  count: 548
  reason: "The tooltips that follow a code fragment repeat a symbol's name, declaration, brief and definition, but which fragments get them depends on the state of Doxygen's code parser (once per output file, yet missing on some pages that link the symbol), and an enum value's line isn't in the XML"
  evidence: "First_steps.xml links PDI_expose (group__annotation_1gae809befdb9bde9abad07a9e0eab894d7) in code, and First_steps.html links it without its tooltip, which how_to_create_plugin.html has; <enumvalue> has no <location>"
- oracle: pdi
  pages: hierarchy
  select: td.desc
  text: "^\"trait\" that implements"
  empty: true
  count: 1
  reason: "The class hierarchy shows the brief of a class outside the XML (PDI::impl::What_impl, in an excluded namespace), which no XML file holds"
  evidence: "What_impl appears only as a <basecompoundref> and an <inheritancegraph> <node> label in classPDI_1_1Multiple__errors.xml and classPDI_1_1Spectree__error.xml; hierarchy.html row 4_1_ has its brief"
- oracle: sample
  pages: "*"
  select: td.memname a.el
  text: '^(demo::Box|demo::Foo|cpoint_t)$'
  unwrap: true
  count: 5
  reason: "Doxygen links the words of a member's definition that name a symbol, in the scope or globally; the XML links only those of its <type>"
  evidence: "classdemo_1_1Box.xml, front: <type>const T &amp;</type> and <definition>const T &amp; demo::Box&lt; T, N &gt;::front</definition>, without a ref to demo::Box"
